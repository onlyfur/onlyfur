  <style>
    /* Mobile Touch Improvements */
    * {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-touch-callout: none;
    }
    
    /* Smooth scrolling for mobile */
    html {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    
    /* Prevent zoom on input focus (mobile) */
    input, textarea, select {
      font-size: 16px !important;
    }
    
    /* Mobile loading screen */
    #mobile-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    #mobile-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .mobile-loader-content {
      text-align: center;
      color: white;
    }
    
    .mobile-loader-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
  </style>

<body>
  <!-- Mobile Loading Screen -->
  <div id="mobile-loader">
    <div class="mobile-loader-content">
      <div class="mobile-loader-icon">🐾</div>
      <h3 style="margin: 0; font-size: 18px; font-weight: 600;">OnlyFur</h3>
      <p style="margin: 8px 0 0; font-size: 14px; opacity: 0.9;">Loading your furry experience...</p>
    </div>
  </div>
  
  <div id="root"></div>
  
  <!-- Mobile-Optimized Loading Script -->
  <script>
    // Hide loader when app loads
    window.addEventListener('load', function() {
      const loader = document.getElementById('mobile-loader');
      if (loader) {
        setTimeout(() => {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 300);
        }, 500);
      }
    });
    
    // Handle orientation changes
    window.addEventListener('orientationchange', function() {
      setTimeout(() => {
        window.scrollTo(0, window.scrollY + 1);
        window.scrollTo(0, window.scrollY - 1);
      }, 100);
    });
  </script>
  
</body>

</html>
