name: PR Quality Checks

on:
  pull_request:
    branches: [ main, master, development ]
    types: [opened, synchronize, reopened]

# Cancel previous runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick validation checks
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check package.json integrity
      run: npm audit --audit-level high

    - name: Validate environment setup
      run: |
        # Check if required scripts exist in package.json
        npm run | grep "test:backend" || exit 1
        npm run | grep "test:backend:unit" || exit 1
        npm run | grep "test:backend:integration" || exit 1
        
        # Validate test files exist
        test -f tests/backend-unit.test.js || exit 1
        test -f tests/backend-simple.test.js || exit 1
        test -f tests/setup.js || exit 1
        
        echo "✅ Environment validation passed"

    - name: Lint check (if configured)
      run: npm run lint || echo "No lint script found, skipping"
      continue-on-error: true

  # Backend tests with PostgreSQL
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    needs: quick-checks
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: onlyfur_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd "pg_isready -U test_user -d onlyfur_test" --health-interval 10s --health-timeout 5s --health-retries 3
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Wait for PostgreSQL
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5432 -U test_user; then
            echo "✅ PostgreSQL is ready!"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 1
        done

    - name: Generate Prisma client
      run: npm run prisma:generate
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test

    - name: Setup database schema
      run: |
        # Push schema to database (dev mode for CI)
        npx prisma db push --accept-data-loss || echo "Schema push failed, trying migrate..."
        npm run prisma:deploy || echo "No migrations found, continuing..."
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test

    - name: Run backend unit tests
      run: npm run test:backend:unit -- --silent
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test
        JWT_SECRET: test-jwt-secret-for-pr-validation-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-pr-validation
        ADMIN_EMAIL: admin@onlyfur.net
        ADMIN_PASSWORD: test-admin-password-123
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@onlyfur.net
        SUPPORT_EMAIL: support@onlyfur.net
        BCRYPT_ROUNDS: 4
        NODE_ENV: test

    - name: Run backend integration tests
      run: npm run test:backend:integration -- --silent
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test
        JWT_SECRET: test-jwt-secret-for-pr-validation-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-pr-validation
        ADMIN_EMAIL: admin@onlyfur.net
        ADMIN_PASSWORD: test-admin-password-123
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@onlyfur.net
        SUPPORT_EMAIL: support@onlyfur.net
        BCRYPT_ROUNDS: 4
        NODE_ENV: test

  # API startup validation
  api-validation:
    name: API Startup Test
    runs-on: ubuntu-latest
    needs: backend-validation
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test API startup
      run: |
        # Start backend with fake database (just for startup test)
        timeout 20s npm run dev:backend:simple &
        BACKEND_PID=$!
        
        # Wait for startup
        echo "⏳ Testing backend startup..."
        for i in {1..10}; do
          if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
            echo "✅ Backend started successfully!"
            break
          fi
          echo "Waiting for backend startup... ($i/10)"
          sleep 2
        done
        
        # Test health endpoint
        response=$(curl -s http://localhost:3001/api/health)
        echo "Health response: $response"
        
        # Basic validation
        if echo $response | grep -q '"status":"OK"'; then
          echo "✅ Health endpoint working"
        else
          echo "❌ Health endpoint failed"
          exit 1
        fi
        
        # Cleanup
        kill $BACKEND_PID 2>/dev/null || true
      env:
        DATABASE_URL: postgresql://fake:fake@localhost:5432/fake_db
        JWT_SECRET: test-jwt-secret-for-startup-test-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-startup-test
        ADMIN_EMAIL: admin@example.com
        ADMIN_PASSWORD: test-password
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@example.com
        SUPPORT_EMAIL: support@example.com

  # Summary and status
  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: [quick-checks, backend-validation, api-validation]
    if: always()
    
    steps:
    - name: PR Quality Summary
      run: |
        echo "## 🔍 PR Quality Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check each job status
        if [[ "${{ needs.quick-checks.result }}" == "success" ]]; then
          echo "✅ **Quick Checks**: Package integrity and environment validation passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Quick Checks**: Failed - check package.json or environment setup" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.backend-validation.result }}" == "success" ]]; then
          echo "✅ **Backend Tests**: All 44 tests passed (26 unit + 18 integration)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Backend Tests**: Failed - check test output for details" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.api-validation.result }}" == "success" ]]; then
          echo "✅ **API Startup**: Backend starts correctly and health endpoint works" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **API Startup**: Failed - backend may not start properly" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Overall status
        if [[ "${{ needs.quick-checks.result }}" == "success" && "${{ needs.backend-validation.result }}" == "success" && "${{ needs.api-validation.result }}" == "success" ]]; then
          echo "### 🎉 All checks passed! This PR is ready for review." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**What was tested:**" >> $GITHUB_STEP_SUMMARY
          echo "- Package integrity and dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Backend unit tests (JWT, Password, CORS, OAuth, Email)" >> $GITHUB_STEP_SUMMARY
          echo "- Backend integration tests (Database, Auth, Profiles)" >> $GITHUB_STEP_SUMMARY
          echo "- API startup and health endpoints" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "### ⚠️ Some checks failed. Please fix issues before merging." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the failed checks above and ensure all tests pass locally:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'npm run test:backend' >> $GITHUB_STEP_SUMMARY
          echo 'npm run dev:backend' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: Comment PR Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { needs } = context.payload.workflow_run || { needs: {} };
          const success = "${{ needs.quick-checks.result }}" === "success" && 
                         "${{ needs.backend-validation.result }}" === "success" && 
                         "${{ needs.api-validation.result }}" === "success";
          
          const body = success ? 
            "🎉 **All quality checks passed!** ✅\n\n" +
            "- ✅ Package integrity validated\n" +
            "- ✅ Backend tests: 44/44 passing\n" +
            "- ✅ API startup successful\n\n" +
            "This PR is ready for review!" :
            "⚠️ **Some quality checks failed** ❌\n\n" +
            "Please check the workflow results and fix any issues before merging.\n\n" +
            "Run `npm run test:backend` locally to verify fixes.";
          
          // Only comment if there are failures or if this is the first run
          if (!success) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }
