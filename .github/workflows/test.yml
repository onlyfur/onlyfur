name: Backend Tests & Quality Checks

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
    types: [opened, synchronize, reopened, ready_for_review]

  # Allow manual workflow runs
  workflow_dispatch:

jobs:
  # Backend unit and integration tests
  backend-tests:
    name: Backend Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    # Skip tests on draft PRs unless explicitly requested
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: onlyfur_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd "pg_isready -U test_user -d onlyfur_test" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Generate Prisma client
      run: npm run prisma:generate

    - name: Setup test environment
      run: |
        cp .env.example .env.test || echo "No .env.example found, creating test env"
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/onlyfur_test" >> .env.test
        echo "JWT_SECRET=test-jwt-secret-for-ci-cd-pipeline-32-chars" >> .env.test
        echo "JWT_REFRESH_SECRET=test-refresh-secret-for-ci-cd-pipeline" >> .env.test
        echo "ADMIN_EMAIL=admin@onlyfur.net" >> .env.test
        echo "ADMIN_PASSWORD=test-admin-password-123" >> .env.test
        echo "ADMIN_USERNAME=admin" >> .env.test
        echo "CLIENT_BASE_URL=http://localhost:5174" >> .env.test
        echo "FROM_EMAIL=noreply@onlyfur.net" >> .env.test
        echo "SUPPORT_EMAIL=support@onlyfur.net" >> .env.test
        echo "BCRYPT_ROUNDS=4" >> .env.test
        echo "NODE_ENV=test" >> .env.test
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"

    - name: Setup database schema
      run: |
        # Push schema to database (dev mode for CI)
        npx prisma db push --accept-data-loss || echo "Schema push failed, trying migrate..."
        npm run prisma:deploy || echo "No migrations found, continuing..."
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test

    - name: Run backend unit tests
      run: npm run test:backend:unit
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test
        JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-ci-cd-pipeline
        ADMIN_EMAIL: admin@onlyfur.net
        ADMIN_PASSWORD: test-admin-password-123
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@onlyfur.net
        SUPPORT_EMAIL: support@onlyfur.net
        BCRYPT_ROUNDS: 4
        NODE_ENV: test

    - name: Run backend integration tests
      run: npm run test:backend:integration
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test
        JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-ci-cd-pipeline
        ADMIN_EMAIL: admin@onlyfur.net
        ADMIN_PASSWORD: test-admin-password-123
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@onlyfur.net
        SUPPORT_EMAIL: support@onlyfur.net
        BCRYPT_ROUNDS: 4
        NODE_ENV: test

    - name: Run all backend tests with coverage
      run: npm run test:backend -- --coverage
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/onlyfur_test
        JWT_SECRET: test-jwt-secret-for-ci-cd-pipeline-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-ci-cd-pipeline
        ADMIN_EMAIL: admin@onlyfur.net
        ADMIN_PASSWORD: test-admin-password-123
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@onlyfur.net
        SUPPORT_EMAIL: support@onlyfur.net
        BCRYPT_ROUNDS: 4
        NODE_ENV: test

    - name: Upload backend test coverage
      uses: codecov/codecov-action@v4
      if: matrix.node-version == '20.x'
      with:
        file: ./coverage/lcov.info
        flags: backend-tests
        name: codecov-backend
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # API health check test
  api-health-check:
    name: API Health Check
    runs-on: ubuntu-latest
    needs: backend-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test backend startup and health
      run: |
        # Start the backend in serverless mode
        timeout 30s npm run dev:backend:simple &
        BACKEND_PID=$!
        
        # Wait for backend to start
        echo "Waiting for backend to start..."
        for i in {1..15}; do
          if curl -f http://localhost:3001/api/health 2>/dev/null; then
            echo "✅ Backend health check passed!"
            break
          fi
          echo "Attempt $i/15: Backend not ready yet..."
          sleep 2
        done
        
        # Test the health endpoint
        response=$(curl -s http://localhost:3001/api/health)
        echo "Health response: $response"
        
        # Verify response contains expected fields
        echo $response | jq -e '.status == "OK"' || exit 1
        echo $response | jq -e '.message' || exit 1
        echo $response | jq -e '.features' || exit 1
        
        # Clean up
        kill $BACKEND_PID 2>/dev/null || true
        echo "✅ API health check completed successfully!"
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/fake_db
        JWT_SECRET: test-jwt-secret-for-health-check-32-chars
        JWT_REFRESH_SECRET: test-refresh-secret-for-health-check
        ADMIN_EMAIL: admin@example.com
        ADMIN_PASSWORD: test-password
        ADMIN_USERNAME: admin
        CLIENT_BASE_URL: http://localhost:5174
        FROM_EMAIL: noreply@example.com
        SUPPORT_EMAIL: support@example.com

  # Test status summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, api-health-check]
    if: always()
    
    steps:
    - name: Test Results Summary
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.backend-tests.result }}" == "success" ]]; then
          echo "✅ **Backend Tests**: All 44 tests passed (Unit + Integration)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Backend Tests**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.api-health-check.result }}" == "success" ]]; then
          echo "✅ **API Health Check**: Backend startup and endpoints working" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **API Health Check**: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
        echo "- **Unit Tests**: 26 tests (JWT, Password, CORS, OAuth, Email)" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: 18 tests (Database, Auth Workflows, Profiles)" >> $GITHUB_STEP_SUMMARY
        echo "- **Health Checks**: API startup and endpoint validation" >> $GITHUB_STEP_SUMMARY
        
        # Set overall status
        if [[ "${{ needs.backend-tests.result }}" == "success" && "${{ needs.api-health-check.result }}" == "success" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **All tests passed! Ready for merge.** 🎉" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Some tests failed. Please review before merging.** ⚠️" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
